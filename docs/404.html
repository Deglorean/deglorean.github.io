<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Might Help</title>
<meta name="description" content="The page you were looking for could not be found. Browse Might Help resources instead.">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site.css">
<style>
.nf{min-height:82vh;display:grid;place-items:center;padding:30px}
.nfbox{max-width:760px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:28px;padding:46px;box-shadow:var(--shadow)}
.nf h1{font-size:clamp(3rem,9vw,6rem);letter-spacing:-.06em;margin:0 0 10px}
.nf p{color:var(--muted);font-size:1.08rem}
</style>
</head>
<body>
<main class="nf">
  <div class="nfbox">
    <div class="kicker">404</div>
    <h1>That page isn't here.</h1>
    <p>The address may have changed, or the resource may not have been published yet.</p>
    <div class="actions">
      <a class="btn primary" href="./">Go to Might Help →</a>
      <a class="btn" href="./#resources">Browse resources</a>
    </div>
  </div>
</main>
</body>
</html>
